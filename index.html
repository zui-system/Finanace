b.set(FS.doc(C('chats',ws,'messages')),{from:'user',uid:me.id,name:(dispName()||me.email||'').slice(0,60),text:x,at:FS.serverTimestamp()});
b.set(D('chats',ws),{wsName:((cur&&cur.workspaces.name)||'').slice(0,80),email:(me.email||'').slice(0,120),lastText:x.slice(0,200),lastFrom:'user',lastAt:FS.serverTimestamp()});
await b.commit()}
async function chatSend(){const i=$('#cmsg'),x=((i&&i.value)||'').trim().slice(0,1000);if(!x)return;i.value='';cdraft='';try{await chatPost(x)}catch(e){toast(aerr(e));i.value=x;cdraft=x}}
async function reqPlan(k){if(role!=='owner'){toast(t('onlyowner')+' '+role);return}const cur=mem.find(x=>x.workspace_id===ws);
try{await FS.setDoc(D('planRequests',ws),{plan:k,period:pper,status:'pending',by:(dispName()||'').slice(0,60),email:(me.email||'').slice(0,120),wsName:((cur&&cur.workspaces.name)||'').slice(0,80),at:FS.serverTimestamp()});
await chatPost(t('rq_msg')+' '+({pro:'Pro',bisnis:'Bisnis'}[k]||k)+' ('+(pper==='yearly'?t('py'):t('pm'))+')');toast(t('rq_ok'))}catch(e){toast(aerr(e))}}
const reqCard=()=>{const r=preq,pn={pro:'Pro',bisnis:'Bisnis'}[r.plan]||r.plan,per=r.period==='yearly'?t('py'):t('pm'),s=r.status;
return`<div class="card"><h3>${t('rq_t')}</h3><p>${pn} · ${per} · <b class="${s==='approved'?'ok':s==='rejected'?'bad':''}">${t('rq_'+s)}</b>${r.note?`<br><span class="mut">${esc(r.note)}</span>`:''}</p>${s==='pending'?`<p>${t('rq_pay')}</p><p style="white-space:pre-wrap"><b>${esc(PAYINFO)}</b></p><button class="b" onclick="openCfg('chat')">${t('rq_chat')}</button>`:''}</div>`};
function planTab(){const w=mem.find(x=>x.workspace_id===ws)||{},i=planInfo(),L=LIM[i.p],used=LM.mYm===ymNow()?Math.max(0,st.entries.length-LM.mBase):0,y=pper==='yearly',
bar=(a,b)=>b?`<div style="height:8px;border-radius:6px;background:var(--line);overflow:hidden"><div style="height:8px;width:${Math.min(100,a/b*100)}%;background:var(--ac)"></div></div>`:'',pn={free:t('freen'),pro:'Pro',bisnis:'Bisnis'}[i.p];
const cur=`<div class="card"><h3>${t('planh')}: ${pn}${i.trial?' · '+t('trialn'):''}</h3>${i.until?`<p class="mut">${t('until')} ${dShort(i.until)}</p>`:''}<p>${t('pmem')}: <b>${w.members||1}</b> / ${L.m}</p>${bar(w.members||1,L.m)}<p>${t('ptx')}: <b>${used}</b> / ${L.tx??t('unl')}</p>${bar(used,L.tx)}<p class="mut" style="font-size:12px">ID: <code style="user-select:all">${esc(ws)}</code></p><div class="row"><button class="b ${y?'g':''}" onclick="pper='monthly';draw()">${t('perm')}</button><button class="b ${y?'':'g'}" onclick="pper='yearly';draw()">${t('pery')}</button></div></div>`;
const cards=PL.map(p=>{const price=y?p.y:p.m,act=i.p===p.k&&!i.trial,btn=p.k==='free'?'':act?`<span class="badge" style="align-self:flex-start">${t('plan_act')}</span>`:`<button class="b ${p.k==='pro'?'':'g'}" onclick="reqPlan('${p.k}')">${t('plan_pick')} ${L_(p.n)}</button>`;
return`<div class="card plan ${p.k==='pro'?'hot':''}"><h3 style="margin:0">${L_(p.n)}${p.k==='pro'?` <span class="badge">${t('l_pop')}</span>`:''}</h3><div class="price">${fmt(price,'IDR')}</div><small>${price?(y?t('py'):t('pm')):t('forever')}</small><ul>${p.f.map(x=>`<li>${L_(x)}</li>`).join('')}</ul>${btn}</div>`}).join('');
return cur+(preq?reqCard():'')+cards}

Object.assign(S,{refund:["Kebijakan Pengembalian Dana","Refund Policy","Dasar Bayaran Balik"],contact:["Kontak & Alamat","Contact & Address","Hubungi & Alamat"],ver:["versi","version","versi"],draftl:["Draf, belum ditinjau ahli hukum.","Draft, not yet reviewed by a lawyer.","Draf, belum disemak oleh peguam."],legalprev:["","If the language versions differ, the Indonesian version prevails.","Jika versi bahasa berbeza, versi Bahasa Indonesia diutamakan."]});
const LEGAL={"id":{"terms":{"i":["Syarat ini mengatur penggunaan aplikasi ZUI Finance (“aplikasi”) yang dikelola oleh ZUI System, PT. Zaor Utama Indonesia (“kami”). Dengan membuat akun atau memakai aplikasi, kamu menyetujui syarat ini."],"s":[["1. Layanan kami",["ZUI Finance membantu perusahaan mengelola keuangan: jurnal, buku besar, faktur, laporan keuangan (neraca saldo, laba rugi, posisi keuangan, dan arus kas), multi mata uang (Rupiah, Ringgit Malaysia, dan Dolar AS), rekonsiliasi bank, jurnal berulang, serta tutup buku tahunan. Aplikasi adalah alat bantu pencatatan, bukan nasihat akuntansi, pajak, atau hukum. Kami bisa menambah, mengubah, atau menghentikan fitur dari waktu ke waktu."]],["2. Akun dan keamanan",[["ul",["Kamu wajib memberi nama dan email yang benar, dan memverifikasi email sebelum akun aktif.","Jaga kerahasiaan kata sandi. Semua kegiatan di akunmu menjadi tanggung jawabmu.","Segera hubungi kami bila kamu menduga akunmu dipakai orang lain."]]]],["3. Buku usaha, anggota tim, dan peran",["Pemilik (owner) buku usaha di aplikasi bisa mengundang anggota tim dan mengatur perannya sebagai owner, editor, atau viewer. Pemilik bertanggung jawab atas siapa saja yang diundang dan data yang bisa mereka lihat atau ubah."]],["4. Masa uji coba dan langganan",[["ul",["Buku usaha baru mendapat masa uji coba paket Pro gratis selama 14 hari. Setelah itu, buku beralih ke paket Gratis kecuali kamu berlangganan.","Paket Gratis bisa dipakai tanpa batas waktu, dengan batas 1 anggota dan 100 transaksi per bulan.","Kamu bisa memilih paket Pro atau Bisnis untuk 1 bulan atau 12 bulan. Harga berlaku per buku usaha dan ditampilkan di aplikasi.","Saat ini pembayaran dilakukan lewat QRIS yang diberikan admin melalui menu Chat. Paket aktif setelah admin mengecek pembayaranmu. Langganan tidak diperpanjang otomatis.","Kami sedang menyiapkan pembayaran otomatis. Bila sudah tersedia, kami akan mengumumkannya di aplikasi dan memperbarui syarat ini.","Jika masa langganan habis, buku kembali ke paket Gratis. Data tetap aman dan bisa dilihat, tetapi fitur berbayar tidak bisa dipakai sampai diperpanjang.","Langganan yang sudah aktif tidak dapat dibatalkan dan pembayarannya tidak dapat dikembalikan, kecuali karena kesalahan pembayaran sesuai Kebijakan Pengembalian Dana."]]]],["5. Data milikmu",["Data yang kamu masukkan tetap milikmu. Kami hanya memakainya untuk menjalankan layanan sesuai Kebijakan Privasi. Kamu bertanggung jawab atas kebenaran data, termasuk data pelanggan yang kamu catat, serta memastikan kamu berhak memasukkannya. Kami menyarankan kamu mencadangkan data secara berkala, misalnya dengan ekspor CSV dan cetak laporan."]],["6. Penggunaan yang dilarang",[["ul",["Memakai aplikasi untuk kegiatan yang melanggar hukum atau menipu, termasuk mencatat transaksi fiktif.","Mencoba membuka data perusahaan lain, membobol keamanan, atau mengganggu kerja aplikasi.","Menjual kembali atau menyalin aplikasi tanpa izin tertulis dari kami."]]]],["7. Ketersediaan layanan",["Kami berusaha agar aplikasi selalu bisa dipakai, tetapi tidak menjamin layanan bebas gangguan. Pemeliharaan, gangguan jaringan, atau gangguan penyedia infrastruktur bisa membuat aplikasi sementara tidak tersedia."]],["8. Batas tanggung jawab",["Laporan dan dokumen yang dibuat aplikasi, seperti faktur, neraca saldo, laba rugi, dan arus kas, dihitung dari data yang kamu masukkan. Periksa kembali angka sebelum dikirim ke pelanggan atau dipakai untuk pajak, dan konsultasikan dengan akuntan atau konsultan pajak untuk keputusan penting. Sejauh diizinkan hukum, kami tidak bertanggung jawab atas kerugian tidak langsung, kehilangan keuntungan, atau kerugian akibat data yang salah."]],["9. Penghentian",["Kamu bisa berhenti memakai aplikasi kapan saja, menghapus semua data buku lewat menu Pengaturan, atau meminta penghapusan akun lewat email. Kami bisa menangguhkan atau menutup akun yang melanggar syarat ini, dengan pemberitahuan bila memungkinkan."]],["10. Perubahan syarat",["Kami bisa memperbarui syarat ini. Perubahan penting akan kami umumkan di aplikasi atau lewat email. Tanggal berlaku di atas menunjukkan versi terbaru."]],["11. Hukum yang berlaku",["Syarat ini tunduk pada hukum Republik Indonesia. Perselisihan diselesaikan lebih dulu secara musyawarah, dan bila tidak tercapai, melalui Pengadilan Negeri Pamekasan."]],["12. Hubungi kami",["Lihat Kontak & Alamat."]]]},"privacy":{"i":["Kebijakan ini menjelaskan data apa yang dikumpulkan ZUI Finance, untuk apa, dan bagaimana kamu bisa mengaturnya. Kami mengikuti Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi."],"s":[["1. Data yang kami kumpulkan",[["ul",["**Data akun:** nama, email, dan kata sandi. Kata sandi dikelola oleh Firebase Authentication dan tidak bisa kami lihat. Bila kamu masuk dengan Google, kami menerima nama, email, dan foto profil akun Google-mu.","**Data keuangan yang kamu masukkan:** profil dan logo usaha, daftar akun, jurnal, faktur, data pelanggan, data rekonsiliasi bank, aturan jurnal berulang, dan kurs mata uang.","**Pesan bantuan:** isi chat dengan admin dan permintaan paket langganan.","**Pengaturan perangkat:** bahasa, mata uang tampilan, dan tema yang disimpan di browser perangkatmu."]]]],["2. Untuk apa data dipakai",[["ul",["Menjalankan fitur aplikasi, seperti menyimpan data, menyusun laporan, dan membuat faktur.","Memverifikasi email, mengirim undangan tim, dan membantu atur ulang kata sandi.","Mengelola masa uji coba dan langganan.","Menjawab pertanyaan dan permintaan bantuan darimu."]],"Kami tidak menjual data pribadi dan tidak memakainya untuk iklan."]],["3. Tempat penyimpanan dan keamanan",["Data disimpan di layanan Google Firebase (Authentication dan Cloud Firestore), sehingga server penyimpanannya bisa berada di luar Indonesia. Data buku usaha hanya bisa dibuka oleh anggota tim yang diundang, sesuai perannya. Setiap jurnal dicatat dalam rantai audit sehingga perubahan diam-diam bisa terdeteksi. Koneksi ke aplikasi dienkripsi dengan HTTPS."]],["4. Berbagi data",["Kami hanya berbagi data dengan:",["ul",["Google, sebagai penyedia infrastruktur penyimpanan dan login.","Orang yang kamu beri akses, seperti anggota tim, atau penerima faktur dan laporan yang kamu cetak atau kirim sendiri.","Pihak berwenang, bila diwajibkan oleh hukum."]]]],["5. Hakmu",["Kamu berhak meminta salinan data pribadimu, memperbaiki data yang salah, menghapus data, dan menarik persetujuan. Sebagian besar bisa kamu lakukan sendiri di aplikasi. Untuk permintaan lain, kirim email ke alamat di bawah. Kami akan menanggapi paling lambat 3 × 24 jam sejak permintaan diterima."]],["6. Lama penyimpanan dan penghapusan",["Data disimpan selama akun atau buku usahamu aktif. Pemilik buku usaha bisa menghapus semua data buku lewat menu Pengaturan; data itu langsung dihapus dari server. Untuk menghapus akun, kirim email ke support@zuisystem.com dari email akunmu, dan kami memprosesnya paling lambat 7 hari kerja. Salinan cadangan di penyedia infrastruktur, bila ada, terhapus permanen paling lambat 30 hari setelah penghapusan."]],["7. Data pelanggan",["Bila kamu mencatat data pelanggan, misalnya nama dan alamat di faktur, kamu yang menentukan data tersebut dan bertanggung jawab memberi tahu mereka. Kami memproses data itu atas namamu dan hanya untuk menjalankan aplikasi."]],["8. Pengguna di bawah umur",["Aplikasi ini ditujukan untuk usaha dan tidak ditujukan bagi anak di bawah 18 tahun."]],["9. Perubahan kebijakan",["Bila kebijakan ini berubah, kami akan memperbarui tanggal berlaku dan memberi tahu perubahan penting di aplikasi atau lewat email."]],["10. Hubungi kami",["Pertanyaan atau permintaan soal data pribadi bisa dikirim ke **support@zuisystem.com**. Alamat lengkap ada di Kontak & Alamat."]]]},"refund":{"i":["Kebijakan ini menjelaskan aturan pengembalian dana untuk pembayaran langganan ZUI Finance.",["nt","Langganan yang sudah aktif bersifat final. Langganan tidak dapat dibatalkan dan pembayarannya tidak dapat dikembalikan, kecuali karena kesalahan pembayaran pada bagian 3."]],"s":[["1. Coba dulu sebelum membayar",["Setiap buku usaha baru mendapat masa uji coba paket Pro gratis 14 hari tanpa pembayaran, dan paket Gratis bisa dipakai tanpa batas waktu. Kami menyarankan kamu memakai masa ini untuk memastikan aplikasi sesuai kebutuhan sebelum berlangganan."]],["2. Paket dan harga",[["tb",[["Paket","Anggota tim","Transaksi","1 bulan","12 bulan"],["Gratis","1","100 per bulan","Rp0","Rp0"],["Pro","3","Tanpa batas","Rp49.000","Rp490.000"],["Bisnis","10","Tanpa batas","Rp99.000","Rp990.000"]]],"Harga berlaku per buku usaha. Langganan tidak diperpanjang otomatis, jadi tidak ada tagihan berulang tanpa persetujuanmu."]],["3. Pengecualian: kesalahan pembayaran",["Pengembalian dana hanya berlaku untuk kesalahan pembayaran berikut:",["ul",["**Pembayaran ganda:** kamu membayar dua kali untuk tagihan yang sama. Kelebihannya dikembalikan penuh.","**Kelebihan bayar:** jumlah yang dibayar lebih besar dari harga paket. Selisihnya dikembalikan.","**Paket tidak diaktifkan:** paket belum aktif dalam 3 × 24 jam setelah kamu mengirim bukti bayar yang benar, dan kamu memilih membatalkan. Pembayaran dikembalikan penuh."]]]],["4. Pembayaran yang tidak bisa dikembalikan",[["ul",["Langganan yang sudah aktif, termasuk perpanjangan, dengan alasan apa pun, misalnya berubah pikiran atau tidak lagi memakai aplikasi.","Sisa masa langganan bila kamu berhenti memakai aplikasi di tengah periode.","Pembatalan paket atau penurunan ke paket yang lebih murah selama masa langganan.","Akun atau buku usaha yang ditutup karena melanggar Syarat Layanan.","Pembayaran yang dikirim ke tujuan selain QRIS resmi ZUI Finance yang diberikan admin."]]]],["5. Cara mengajukan",["Kirim email ke **support@zuisystem.com** dengan judul “Pengembalian Dana” dan sertakan:",["ul",["nama usaha dan email akun,","nomor referensi dan tanggal pembayaran, serta jumlah yang dibayar,","alasan pengajuan,","nama bank atau e-wallet, nomor rekening, dan nama pemilik rekening untuk menerima dana."]]]],["6. Proses dan waktu",[["ul",["Kami membalas pengajuan paling lambat 2 hari kerja.","Bila disetujui, dana dikirim dalam 7 sampai 14 hari kerja ke rekening bank atau e-wallet yang kamu berikan.","Pengembalian karena pembayaran ganda atau kelebihan bayar tidak mengubah paket yang sudah aktif. Untuk paket yang belum diaktifkan, pesanannya dibatalkan dan data buku usahamu tetap aman."]]]]]},"contact":{"i":["ZUI Finance dikelola oleh ZUI System, PT. Zaor Utama Indonesia.",["ul",["**Perusahaan:** PT. Zaor Utama Indonesia","**Alamat:** Dsn. Togur Dajah, Sotabar, Pasean, Pamekasan, Jawa Timur 69356, Indonesia","**Bantuan & pengembalian dana:** support@zuisystem.com","**Informasi umum & kerja sama:** info@zuisystem.com","**WhatsApp:** +62 882-0007-49699","**Jam layanan:** Setiap hari, 08.00–22.00 WIB","**Situs aplikasi:** finance.zuisystem.com"]]],"s":[]}},"en":{"terms":{"i":["These terms govern your use of the ZUI Finance app (the “app”), operated by ZUI System, PT. Zaor Utama Indonesia (“we”). By creating an account or using the app, you agree to these terms."],"s":[["1. Our service",["ZUI Finance helps companies manage their finances: journal, ledger, invoices, financial reports (trial balance, income statement, balance sheet, and cash flow), multi-currency (Indonesian Rupiah, Malaysian Ringgit, and US Dollar), bank reconciliation, recurring entries, and year-end closing. The app is a record-keeping tool, not accounting, tax, or legal advice. We may add, change, or discontinue features from time to time."]],["2. Account and security",[["ul",["You must provide a correct name and email, and verify your email before your account is active.","Keep your password confidential. You are responsible for all activity in your account.","Contact us right away if you suspect someone else is using your account."]]]],["3. Business books, team members, and roles",["The owner of a business book can invite team members and set their role as owner, editor, or viewer. The owner is responsible for who is invited and for the data they can see or change."]],["4. Trial and subscription",[["ul",["A new business book gets a free 14-day trial of the Pro plan. After that, the book moves to the Free plan unless you subscribe.","The Free plan can be used with no time limit, with a limit of 1 member and 100 entries per month.","You can choose the Pro or Business plan for 1 month or 12 months. Prices are per business book and are shown in the app.","For now, payment is made by QRIS provided by the admin through the Chat menu. The plan is activated after the admin checks your payment. Subscriptions do not renew automatically.","We are preparing automatic payments. When they are available, we will announce it in the app and update these terms.","When a subscription ends, the book returns to the Free plan. Your data stays safe and viewable, but paid features cannot be used until you renew.","An active subscription cannot be cancelled and its payment cannot be refunded, except for payment errors as described in the Refund Policy."]]]],["5. Your data",["The data you enter remains yours. We only use it to run the service as described in the Privacy Policy. You are responsible for the accuracy of the data, including customer data you record, and for making sure you are entitled to enter it. We recommend backing up your data regularly, for example with CSV export and printed reports."]],["6. Prohibited use",[["ul",["Using the app for unlawful or fraudulent activity, including recording fictitious transactions.","Trying to access other companies’ data, break security, or disrupt the app.","Reselling or copying the app without our written permission."]]]],["7. Service availability",["We try to keep the app available at all times but do not guarantee uninterrupted service. Maintenance, network problems, or infrastructure provider outages may make the app temporarily unavailable."]],["8. Limitation of liability",["Reports and documents produced by the app, such as invoices, trial balances, income statements, and cash flow statements, are calculated from the data you enter. Check the figures before sending them to customers or using them for tax, and consult an accountant or tax adviser for important decisions. To the extent permitted by law, we are not liable for indirect losses, lost profits, or losses caused by incorrect data."]],["9. Termination",["You can stop using the app at any time, erase all book data from the Settings menu, or request account deletion by email. We may suspend or close accounts that breach these terms, with notice where possible."]],["10. Changes to these terms",["We may update these terms. We will announce important changes in the app or by email. The effective date above shows the latest version."]],["11. Governing law",["These terms are governed by the laws of the Republic of Indonesia. Disputes are first settled by mutual discussion and, if no agreement is reached, through the Pamekasan District Court."]],["12. Contact us",["See Contact & Address."]]]},"privacy":{"i":["This policy explains what data ZUI Finance collects, why, and how you can manage it. We follow Indonesian Law No. 27 of 2022 on Personal Data Protection."],"s":[["1. Data we collect",[["ul",["**Account data:** name, email, and password. Passwords are managed by Firebase Authentication and we cannot see them. If you sign in with Google, we receive your Google account name, email, and profile photo.","**Financial data you enter:** business profile and logo, chart of accounts, journal entries, invoices, customer data, bank reconciliation data, recurring entry rules, and exchange rates.","**Support messages:** chats with the admin and subscription plan requests.","**Device settings:** language, display currency, and theme, stored in your device’s browser."]]]],["2. How we use data",[["ul",["Running app features, such as saving data, building reports, and creating invoices.","Verifying email, sending team invitations, and helping reset passwords.","Managing trials and subscriptions.","Answering your questions and support requests."]],"We do not sell personal data and do not use it for advertising."]],["3. Storage and security",["Data is stored with Google Firebase (Authentication and Cloud Firestore), so the storage servers may be located outside Indonesia. Business book data can only be opened by invited team members, according to their role. Every journal entry is recorded in an audit chain so silent changes can be detected. Connections to the app are encrypted with HTTPS."]],["4. Sharing data",["We only share data with:",["ul",["Google, as the storage and sign-in infrastructure provider.","People you give access to, such as team members, or recipients of invoices and reports you print or send yourself.","Authorities, when required by law."]]]],["5. Your rights",["You have the right to request a copy of your personal data, correct inaccurate data, delete data, and withdraw consent. You can do most of this yourself in the app. For other requests, email the address below. We will respond within 3 × 24 hours of receiving the request."]],["6. Retention and deletion",["Data is kept while your account or business book is active. The owner of a business book can erase all book data from the Settings menu; that data is removed from the server immediately. To delete your account, email support@zuisystem.com from your account email, and we will process it within 7 business days. Backup copies at the infrastructure provider, if any, are permanently deleted within 30 days after deletion."]],["7. Customer data",["If you record customer data, such as names and addresses on invoices, you decide on that data and are responsible for informing them. We process that data on your behalf and only to run the app."]],["8. Minors",["The app is intended for businesses and is not intended for children under 18."]],["9. Changes to this policy",["If this policy changes, we will update the effective date and announce important changes in the app or by email."]],["10. Contact us",["Questions or requests about personal data can be sent to **support@zuisystem.com**. Our full address is in Contact & Address."]]]},"refund":{"i":["This policy explains the refund rules for ZUI Finance subscription payments.",["nt","An active subscription is final. It cannot be cancelled and its payment cannot be refunded, except for the payment errors in section 3."]],"s":[["1. Try before you pay",["Every new business book gets a free 14-day trial of the Pro plan without payment, and the Free plan can be used with no time limit. We recommend using this time to make sure the app fits your needs before subscribing."]],["2. Plans and prices",[["tb",[["Plan","Team members","Entries","1 month","12 months"],["Free","1","100 per month","Rp0","Rp0"],["Pro","3","Unlimited","Rp49,000","Rp490,000"],["Business","10","Unlimited","Rp99,000","Rp990,000"]]],"Prices are per business book. Subscriptions do not renew automatically, so there are no recurring charges without your approval."]],["3. Exception: payment errors",["Refunds only apply to the following payment errors:",["ul",["**Double payment:** you paid twice for the same bill. The excess is refunded in full.","**Overpayment:** the amount paid is higher than the plan price. The difference is refunded.","**Plan not activated:** the plan is not active within 3 × 24 hours after you send correct proof of payment, and you choose to cancel. The payment is refunded in full."]]]],["4. Non-refundable payments",[["ul",["Active subscriptions, including renewals, for any reason, such as a change of mind or no longer using the app.","The remaining subscription period if you stop using the app mid-period.","Cancelling a plan or downgrading to a cheaper plan during the subscription period.","Accounts or business books closed for breaching the Terms of Service.","Payments sent anywhere other than the official ZUI Finance QRIS provided by the admin."]]]],["5. How to apply",["Email **support@zuisystem.com** with the subject “Refund” and include:",["ul",["business name and account email,","payment reference number, date, and amount paid,","reason for the request,","bank or e-wallet name, account number, and account holder name to receive the funds."]]]],["6. Process and timing",[["ul",["We reply to requests within 2 business days.","If approved, funds are sent within 7 to 14 business days to the bank account or e-wallet you provide.","Refunds for double payment or overpayment do not change an active plan. For a plan that has not been activated, the order is cancelled and your business book data stays safe."]]]]]},"contact":{"i":["ZUI Finance is operated by ZUI System, PT. Zaor Utama Indonesia.",["ul",["**Company:** PT. Zaor Utama Indonesia","**Address:** Dsn. Togur Dajah, Sotabar, Pasean, Pamekasan, Jawa Timur 69356, Indonesia","**Support & refunds:** support@zuisystem.com","**General information & partnerships:** info@zuisystem.com","**WhatsApp:** +62 882-0007-49699","**Service hours:** Every day, 08.00–22.00 WIB (UTC+7)","**App website:** finance.zuisystem.com"]]],"s":[]}},"ms":{"terms":{"i":["Terma ini mengawal penggunaan aplikasi ZUI Finance (“aplikasi”) yang dikendalikan oleh ZUI System, PT. Zaor Utama Indonesia (“kami”). Dengan membuat akaun atau menggunakan aplikasi, anda bersetuju dengan terma ini."],"s":[["1. Perkhidmatan kami",["ZUI Finance membantu syarikat mengurus kewangan: jurnal, lejar, invois, laporan kewangan (imbangan duga, untung rugi, kedudukan kewangan dan aliran tunai), berbilang mata wang (Rupiah, Ringgit Malaysia dan Dolar AS), penyesuaian bank, jurnal berulang serta tutup buku tahunan. Aplikasi ialah alat bantu perekodan, bukan nasihat perakaunan, cukai atau undang-undang. Kami boleh menambah, mengubah atau menghentikan ciri dari semasa ke semasa."]],["2. Akaun dan keselamatan",[["ul",["Anda wajib memberi nama dan e-mel yang betul, dan mengesahkan e-mel sebelum akaun aktif.","Rahsiakan kata laluan anda. Semua aktiviti dalam akaun anda menjadi tanggungjawab anda.","Hubungi kami segera jika anda mengesyaki akaun anda digunakan orang lain."]]]],["3. Buku perniagaan, ahli pasukan dan peranan",["Pemilik (owner) buku perniagaan boleh menjemput ahli pasukan dan menetapkan peranan mereka sebagai owner, editor atau viewer. Pemilik bertanggungjawab atas siapa yang dijemput dan data yang boleh mereka lihat atau ubah."]],["4. Tempoh percubaan dan langganan",[["ul",["Buku perniagaan baharu mendapat tempoh percubaan pelan Pro secara percuma selama 14 hari. Selepas itu, buku beralih ke pelan Percuma kecuali anda melanggan.","Pelan Percuma boleh digunakan tanpa had masa, dengan had 1 ahli dan 100 transaksi sebulan.","Anda boleh memilih pelan Pro atau Perniagaan untuk 1 bulan atau 12 bulan. Harga adalah bagi setiap buku perniagaan dan dipaparkan dalam aplikasi.","Buat masa ini, bayaran dibuat melalui QRIS yang diberikan admin melalui menu Sembang. Pelan diaktifkan selepas admin menyemak bayaran anda. Langganan tidak diperbaharui secara automatik.","Kami sedang menyediakan bayaran automatik. Apabila tersedia, kami akan mengumumkannya dalam aplikasi dan mengemas kini terma ini.","Jika tempoh langganan tamat, buku kembali ke pelan Percuma. Data kekal selamat dan boleh dilihat, tetapi ciri berbayar tidak boleh digunakan sehingga diperbaharui.","Langganan yang sudah aktif tidak boleh dibatalkan dan bayarannya tidak boleh dikembalikan, kecuali kerana kesilapan bayaran menurut Dasar Bayaran Balik."]]]],["5. Data milik anda",["Data yang anda masukkan kekal milik anda. Kami hanya menggunakannya untuk menjalankan perkhidmatan menurut Dasar Privasi. Anda bertanggungjawab atas ketepatan data, termasuk data pelanggan yang anda rekodkan, serta memastikan anda berhak memasukkannya. Kami mencadangkan anda membuat sandaran data secara berkala, contohnya dengan eksport CSV dan cetak laporan."]],["6. Penggunaan yang dilarang",[["ul",["Menggunakan aplikasi untuk aktiviti yang melanggar undang-undang atau menipu, termasuk merekod transaksi palsu.","Cuba membuka data syarikat lain, menceroboh keselamatan atau mengganggu aplikasi.","Menjual semula atau menyalin aplikasi tanpa kebenaran bertulis daripada kami."]]]],["7. Ketersediaan perkhidmatan",["Kami berusaha agar aplikasi sentiasa boleh digunakan, tetapi tidak menjamin perkhidmatan bebas gangguan. Penyelenggaraan, gangguan rangkaian atau gangguan penyedia infrastruktur boleh menyebabkan aplikasi tidak tersedia buat sementara."]],["8. Had tanggungjawab",["Laporan dan dokumen yang dihasilkan aplikasi, seperti invois, imbangan duga, untung rugi dan aliran tunai, dikira daripada data yang anda masukkan. Semak semula angka sebelum dihantar kepada pelanggan atau digunakan untuk cukai, dan rujuk akauntan atau perunding cukai untuk keputusan penting. Setakat yang dibenarkan undang-undang, kami tidak bertanggungjawab atas kerugian tidak langsung, kehilangan keuntungan atau kerugian akibat data yang salah."]],["9. Penamatan",["Anda boleh berhenti menggunakan aplikasi pada bila-bila masa, memadam semua data buku melalui menu Tetapan, atau meminta pemadaman akaun melalui e-mel. Kami boleh menggantung atau menutup akaun yang melanggar terma ini, dengan notis jika boleh."]],["10. Perubahan terma",["Kami boleh mengemas kini terma ini. Perubahan penting akan diumumkan dalam aplikasi atau melalui e-mel. Tarikh berkuat kuasa di atas menunjukkan versi terkini."]],["11. Undang-undang yang terpakai",["Terma ini tertakluk kepada undang-undang Republik Indonesia. Pertikaian diselesaikan terlebih dahulu secara rundingan, dan jika tidak tercapai, melalui Mahkamah Daerah Pamekasan."]],["12. Hubungi kami",["Lihat Hubungi & Alamat."]]]},"privacy":{"i":["Dasar ini menerangkan data yang dikumpul oleh ZUI Finance, untuk apa, dan bagaimana anda boleh mengurusnya. Kami mematuhi Undang-Undang Indonesia Nombor 27 Tahun 2022 tentang Perlindungan Data Peribadi."],"s":[["1. Data yang kami kumpul",[["ul",["**Data akaun:** nama, e-mel dan kata laluan. Kata laluan diurus oleh Firebase Authentication dan tidak boleh kami lihat. Jika anda log masuk dengan Google, kami menerima nama, e-mel dan foto profil akaun Google anda.","**Data kewangan yang anda masukkan:** profil dan logo perniagaan, senarai akaun, jurnal, invois, data pelanggan, data penyesuaian bank, peraturan jurnal berulang dan kadar tukaran.","**Mesej bantuan:** sembang dengan admin dan permintaan pelan langganan.","**Tetapan peranti:** bahasa, mata wang paparan dan tema yang disimpan dalam pelayar peranti anda."]]]],["2. Kegunaan data",[["ul",["Menjalankan ciri aplikasi, seperti menyimpan data, menyusun laporan dan membuat invois.","Mengesahkan e-mel, menghantar jemputan pasukan dan membantu menetapkan semula kata laluan.","Mengurus tempoh percubaan dan langganan.","Menjawab soalan dan permintaan bantuan anda."]],"Kami tidak menjual data peribadi dan tidak menggunakannya untuk iklan."]],["3. Tempat penyimpanan dan keselamatan",["Data disimpan dalam perkhidmatan Google Firebase (Authentication dan Cloud Firestore), jadi pelayan storan boleh berada di luar Indonesia. Data buku perniagaan hanya boleh dibuka oleh ahli pasukan yang dijemput, menurut peranan mereka. Setiap jurnal direkodkan dalam rantaian audit supaya perubahan senyap boleh dikesan. Sambungan ke aplikasi disulitkan dengan HTTPS."]],["4. Perkongsian data",["Kami hanya berkongsi data dengan:",["ul",["Google, sebagai penyedia infrastruktur storan dan log masuk.","Orang yang anda beri akses, seperti ahli pasukan, atau penerima invois dan laporan yang anda cetak atau hantar sendiri.","Pihak berkuasa, jika diwajibkan oleh undang-undang."]]]],["5. Hak anda",["Anda berhak meminta salinan data peribadi anda, membetulkan data yang salah, memadam data dan menarik balik persetujuan. Kebanyakannya boleh anda lakukan sendiri dalam aplikasi. Untuk permintaan lain, hantar e-mel ke alamat di bawah. Kami akan menjawab dalam tempoh 3 × 24 jam selepas permintaan diterima."]],["6. Tempoh simpanan dan pemadaman",["Data disimpan selagi akaun atau buku perniagaan anda aktif. Pemilik buku perniagaan boleh memadam semua data buku melalui menu Tetapan; data itu terus dipadam daripada pelayan. Untuk memadam akaun, hantar e-mel ke support@zuisystem.com daripada e-mel akaun anda, dan kami akan memprosesnya dalam tempoh 7 hari bekerja. Salinan sandaran di penyedia infrastruktur, jika ada, dipadam secara kekal dalam tempoh 30 hari selepas pemadaman."]],["7. Data pelanggan",["Jika anda merekod data pelanggan, contohnya nama dan alamat pada invois, anda yang menentukan data tersebut dan bertanggungjawab memaklumkan mereka. Kami memproses data itu bagi pihak anda dan hanya untuk menjalankan aplikasi."]],["8. Pengguna bawah umur",["Aplikasi ini ditujukan untuk perniagaan dan tidak ditujukan untuk kanak-kanak di bawah 18 tahun."]],["9. Perubahan dasar",["Jika dasar ini berubah, kami akan mengemas kini tarikh berkuat kuasa dan memaklumkan perubahan penting dalam aplikasi atau melalui e-mel."]],["10. Hubungi kami",["Soalan atau permintaan tentang data peribadi boleh dihantar ke **support@zuisystem.com**. Alamat penuh ada di Hubungi & Alamat."]]]},"refund":{"i":["Dasar ini menerangkan peraturan bayaran balik untuk bayaran langganan ZUI Finance.",["nt","Langganan yang sudah aktif adalah muktamad. Langganan tidak boleh dibatalkan dan bayarannya tidak boleh dikembalikan, kecuali kerana kesilapan bayaran dalam bahagian 3."]],"s":[["1. Cuba dahulu sebelum membayar",["Setiap buku perniagaan baharu mendapat tempoh percubaan pelan Pro secara percuma selama 14 hari tanpa bayaran, dan pelan Percuma boleh digunakan tanpa had masa. Kami mencadangkan anda menggunakan tempoh ini untuk memastikan aplikasi sesuai dengan keperluan sebelum melanggan."]],["2. Pelan dan harga",[["tb",[["Pelan","Ahli pasukan","Transaksi","1 bulan","12 bulan"],["Percuma","1","100 sebulan","Rp0","Rp0"],["Pro","3","Tanpa had","Rp49.000","Rp490.000"],["Perniagaan","10","Tanpa had","Rp99.000","Rp990.000"]]],"Harga adalah bagi setiap buku perniagaan. Langganan tidak diperbaharui secara automatik, jadi tiada caj berulang tanpa persetujuan anda."]],["3. Pengecualian: kesilapan bayaran",["Bayaran balik hanya terpakai untuk kesilapan bayaran berikut:",["ul",["**Bayaran berganda:** anda membayar dua kali untuk bil yang sama. Lebihannya dikembalikan sepenuhnya.","**Terlebih bayar:** jumlah yang dibayar lebih tinggi daripada harga pelan. Bezanya dikembalikan.","**Pelan tidak diaktifkan:** pelan belum aktif dalam tempoh 3 × 24 jam selepas anda menghantar bukti bayaran yang betul, dan anda memilih untuk membatalkan. Bayaran dikembalikan sepenuhnya."]]]],["4. Bayaran yang tidak boleh dikembalikan",[["ul",["Langganan yang sudah aktif, termasuk pembaharuan, atas apa-apa sebab, contohnya berubah fikiran atau tidak lagi menggunakan aplikasi.","Baki tempoh langganan jika anda berhenti menggunakan aplikasi di pertengahan tempoh.","Pembatalan pelan atau penurunan ke pelan yang lebih murah dalam tempoh langganan.","Akaun atau buku perniagaan yang ditutup kerana melanggar Terma Perkhidmatan.","Bayaran yang dihantar ke destinasi selain QRIS rasmi ZUI Finance yang diberikan admin."]]]],["5. Cara memohon",["Hantar e-mel ke **support@zuisystem.com** dengan tajuk “Bayaran Balik” dan sertakan:",["ul",["nama perniagaan dan e-mel akaun,","nombor rujukan, tarikh dan jumlah bayaran,","sebab permohonan,","nama bank atau e-dompet, nombor akaun dan nama pemegang akaun untuk menerima dana."]]]],["6. Proses dan tempoh",[["ul",["Kami membalas permohonan dalam tempoh 2 hari bekerja.","Jika diluluskan, dana dihantar dalam tempoh 7 hingga 14 hari bekerja ke akaun bank atau e-dompet yang anda berikan.","Bayaran balik kerana bayaran berganda atau terlebih bayar tidak mengubah pelan yang sudah aktif. Untuk pelan yang belum diaktifkan, pesanan dibatalkan dan data buku perniagaan anda kekal selamat."]]]]]},"contact":{"i":["ZUI Finance dikendalikan oleh ZUI System, PT. Zaor Utama Indonesia.",["ul",["**Syarikat:** PT. Zaor Utama Indonesia","**Alamat:** Dsn. Togur Dajah, Sotabar, Pasean, Pamekasan, Jawa Timur 69356, Indonesia","**Bantuan & bayaran balik:** support@zuisystem.com","**Maklumat am & kerjasama:** info@zuisystem.com","**WhatsApp:** +62 882-0007-49699","**Waktu perkhidmatan:** Setiap hari, 08.00–22.00 WIB (UTC+7)","**Laman web aplikasi:** finance.zuisystem.com"]]],"s":[]}}};
