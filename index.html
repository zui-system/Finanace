['3. Tujuan dan dasar pemrosesan','Untuk menyediakan Layanan, mengautentikasi Anda, mengirim email verifikasi dan undangan tim, menjaga keamanan, memberi dukungan, dan memperbaiki Layanan. Dasarnya adalah persetujuan Anda dan pelaksanaan perjanjian layanan. Kami tidak menjual data pribadi Anda dan tidak memakainya untuk iklan.'],
['4. Pihak ketiga','Kami memakai Google Firebase (database, autentikasi, dan hosting), Google (login), penyedia pengiriman email untuk verifikasi dan undangan, Google Fonts untuk tampilan, dan penyedia pembayaran saat fitur berbayar tersedia. Pihak-pihak tersebut memproses data sesuai kebijakan dan perjanjian masing-masing.'],
['5. Penyimpanan di perangkat','Aplikasi menyimpan preferensi (bahasa, mata uang, tema) dan berkas aplikasi untuk penggunaan offline terbatas di browser Anda. Kami tidak memakai pelacak iklan pihak ketiga.'],
['6. Keamanan','Koneksi memakai HTTPS, akses data dibatasi per pengguna dengan aturan di tingkat database, dan jurnal dicatat dalam rantai audit. Tidak ada sistem yang sepenuhnya aman. Jika terjadi kegagalan perlindungan data pribadi yang berdampak pada Anda, Kami akan memberi tahu Anda dan pihak berwenang sesuai peraturan yang berlaku.'],
['7. Penyimpanan dan penghapusan','Data disimpan selama akun aktif atau selama diperlukan untuk menjalankan Layanan dan memenuhi kewajiban hukum. Anda dapat meminta penghapusan akun dan data. Salinan cadangan dapat bertahan sementara sesuai kebijakan penyedia infrastruktur.'],
['8. Berbagi dalam tim','Anggota tim yang Anda undang dapat melihat data buku sesuai perannya (owner, editor, viewer). Owner dapat mengelola dan mencabut akses anggota.'],
['9. Hak Anda','Sesuai Undang-Undang Pelindungan Data Pribadi (UU No. 27 Tahun 2022) dan peraturan terkait, Anda berhak meminta akses, koreksi, ekspor, atau penghapusan data, membatasi pemrosesan, serta menarik persetujuan. Hubungi {K}; Kami akan menanggapi dalam waktu yang wajar.'],
['10. Anak-anak','Layanan ditujukan untuk pengguna dewasa dan pelaku usaha, bukan untuk anak di bawah umur.'],
['11. Transfer data lintas negara','Data dapat diproses di server di luar Indonesia, termasuk Singapura, dan oleh penyedia layanan di negara lain, dengan perlindungan yang setara sesuai peraturan yang berlaku.'],
['12. Perubahan dan kontak','Kebijakan ini dapat diperbarui, dan tanggal berlaku akan diubah. Pertanyaan dapat dikirim ke {K}.']);

const pAmt=s=>{s=String(s).trim();const neg=/^\(.*\)$/.test(s)||/^[-\u2212\u2013]/.test(s)||/-$/.test(s);s=s.replace(/[^\d.,]/g,'');if(!s)return NaN;const m=s.match(/^(.*)[.,](\d{1,2})$/),n=m?parseFloat(m[1].replace(/[.,]/g,'')+'.'+m[2]):parseFloat(s.replace(/[.,]/g,''));return neg?-n:n};

const TERMS_EN=[["1. Acceptance of Terms", "By creating an account or using Zui Finance (the “Service”), you agree to these Terms of Service. The Service is operated by {O} (“we”). If you do not agree, please do not use the Service."], ["2. About the Service", "Zui Finance is a bookkeeping tool for small and medium businesses: journal, ledger, invoices, reports, reconciliation and year-end closing. The Service is not accounting, tax, legal or investment advice. You are responsible for the accuracy of your data, your calculations, your tax filings and your legal compliance. For important decisions, consult an accountant or tax advisor."], ["3. Account and security", "You must be of legal age or represent a lawful business. You must provide accurate information, keep your password confidential, and you are responsible for all activity in your account and books, including by team members you invite. Contact us immediately if your account is misused."], ["4. Your data", "Your bookkeeping data remains yours. You grant us a limited permission to store, process and display it only to operate, secure and improve the Service. You can export your data (including year-end archives) and request account deletion."], ["5. Journals, archives and year-end closing", "Journal entries cannot be edited; corrections are made by reversal entries. Year-end closing moves past-year entries into an immutable archive and creates an opening balance entry for the next year. Closing cannot be undone from the app, so review your reports before closing."], ["6. Plans and payment", "The Service offers free and paid plans, including a 14-day Pro trial for new books. Prices, feature limits and billing periods are shown before you pay. Once payments are available, subscriptions renew automatically for the same period until cancelled. Applicable taxes may be added. Payments are processed by third-party payment providers. If a plan limit is exceeded, we may refuse new entries or members, but existing data remains viewable and exportable."], ["7. Cancellation and refunds", "You may cancel at any time. Paid access remains until the end of the period already paid. Payments already made are generally non-refundable, unless required by law or agreed by us in writing."], ["8. Prohibited use", "You must not break the law, record fictitious transactions to deceive others, upload harmful code, disrupt or test the Service's security without permission, access other users' data, or resell the Service without our written consent."], ["9. Availability and changes", "We work to keep the Service running but do not guarantee it will be uninterrupted. We may change features or prices with reasonable notice. Price changes apply from the next billing period."], ["10. Limitation of liability", "To the extent permitted by law, the Service is provided “as is”. We are not liable for indirect losses, lost profits or tax penalties arising from your data or use. Our total liability is limited to the fees you paid in the last 12 months. Keep backups of your important reports."], ["11. Termination", "We may suspend or close accounts that breach these Terms, with notice where possible. You may stop using the Service at any time and export your data before the account is closed."], ["12. Governing law and disputes", "These Terms are governed by the laws of the Republic of Indonesia. Disputes are first resolved by consultation; if unsuccessful, by the competent court in Indonesia. Questions can be sent to {K}."], ["13. Changes to the Terms", "We may update these Terms and change the effective date. Continued use of the Service after a change means you accept the new Terms."]],PRIV_EN=[["1. Data controller", "The Service is operated by {O}, which acts as controller of your account data. For bookkeeping data you enter, you decide its content and purpose, and we process it on your behalf to run the Service."], ["2. Data we collect", "Account data (email, display name, and profile photo if provided by Google), bookkeeping data you enter (journals, invoices, customer names, business profile, logo), team data (member emails and roles), preferences (language, currency, theme), and basic technical data such as IP address and device type logged by infrastructure providers."], ["3. Purposes and basis", "To provide the Service, authenticate you, send verification and team invitation emails, keep the Service secure, provide support and improve the Service. The basis is your consent and performance of the service agreement. We do not sell your personal data and do not use it for advertising."], ["4. Third parties", "We use Google Firebase (database, authentication and hosting), Google (sign-in), an email delivery provider for verification and invitations, Google Fonts for display, and a payment provider once paid features are available. These parties process data under their own policies and agreements."], ["5. Storage on your device", "The app stores preferences (language, currency, theme) and application files for limited offline use in your browser. We do not use third-party advertising trackers."], ["6. Security", "Connections use HTTPS, data access is restricted per user by database-level rules, and journal entries are recorded in an audit chain. No system is completely secure. If a personal data protection failure affects you, we will notify you and the authorities as required by applicable regulations."], ["7. Retention and deletion", "Data is kept while your account is active or as needed to run the Service and meet legal obligations. You can request deletion of your account and data. Backup copies may persist temporarily under the infrastructure provider's policy."], ["8. Sharing within a team", "Team members you invite can view book data according to their role (owner, editor, viewer). The owner can manage and revoke member access."], ["9. Your rights", "Under Indonesia's Personal Data Protection Law (Law No. 27 of 2022) and related regulations, you may request access, correction, export or deletion of your data, restrict processing, and withdraw consent. Contact {K}; we will respond within a reasonable time."], ["10. Children", "The Service is intended for adults and business operators, not for minors."], ["11. Cross-border transfers", "Data may be processed on servers outside Indonesia, including Singapore, and by service providers in other countries, with equivalent protection as required by applicable regulations."], ["12. Changes and contact", "This policy may be updated and the effective date changed. Questions can be sent to {K}."]],TERMS_MS=[["1. Penerimaan Terma", "Dengan mencipta akaun atau menggunakan Zui Finance (“Perkhidmatan”), anda bersetuju dengan Terma Perkhidmatan ini. Perkhidmatan ini dikendalikan oleh {O} (“Kami”). Jika tidak bersetuju, sila jangan gunakan Perkhidmatan."], ["2. Tentang Perkhidmatan", "Zui Finance ialah alat bantu pencatatan kewangan untuk perniagaan kecil dan sederhana: jurnal, lejar, invois, laporan, penyesuaian bank dan tutup buku tahunan. Perkhidmatan ini bukan nasihat perakaunan, cukai, undang-undang atau pelaburan. Anda bertanggungjawab ke atas ketepatan data, pengiraan, pemfailan cukai dan pematuhan undang-undang perniagaan anda. Untuk keputusan penting, rujuk akauntan atau perunding cukai."], ["3. Akaun dan keselamatan", "Anda mesti cukup umur di sisi undang-undang atau mewakili perniagaan yang sah. Anda mesti memberikan maklumat yang betul, menjaga kerahsiaan kata laluan, dan bertanggungjawab ke atas semua aktiviti dalam akaun dan buku anda, termasuk oleh ahli pasukan yang anda jemput. Hubungi Kami segera jika akaun disalahgunakan."], ["4. Data anda", "Data perakaunan kekal milik anda. Anda memberi Kami kebenaran terhad untuk menyimpan, memproses dan memaparkannya hanya bagi menjalankan, melindungi dan memperbaiki Perkhidmatan. Anda boleh mengeksport data (termasuk arkib tutup buku) dan meminta pemadaman akaun."], ["5. Jurnal, arkib dan tutup buku", "Jurnal tidak boleh diubah; pembetulan dibuat melalui jurnal songsang. Tutup buku memindahkan jurnal tahun lepas ke arkib yang tidak boleh diubah dan mencipta jurnal baki awal tahun berikutnya. Tutup buku tidak boleh dibatalkan daripada aplikasi, jadi semak laporan sebelum menutup."], ["6. Pelan dan pembayaran", "Perkhidmatan menyediakan pelan percuma dan berbayar, termasuk percubaan Pro 14 hari untuk buku baharu. Harga, had ciri dan tempoh bil dipaparkan sebelum anda membayar. Apabila pembayaran tersedia, langganan diperbaharui secara automatik mengikut tempohnya sehingga dibatalkan. Cukai yang berkenaan boleh ditambah. Pembayaran diproses oleh penyedia pembayaran pihak ketiga. Jika had pelan dilampaui, Kami boleh menolak penambahan data atau ahli baharu, tetapi data sedia ada masih boleh dilihat dan dieksport."], ["7. Pembatalan dan bayaran balik", "Anda boleh membatalkan pada bila-bila masa. Akses berbayar kekal sehingga akhir tempoh yang telah dibayar. Pembayaran yang telah dibuat pada asasnya tidak dikembalikan, kecuali dikehendaki undang-undang atau dipersetujui Kami secara bertulis."], ["8. Penggunaan yang dilarang", "Anda dilarang melanggar undang-undang, merekod transaksi palsu untuk menipu pihak lain, memuat naik kod berbahaya, mengganggu atau menguji keselamatan Perkhidmatan tanpa kebenaran, mengakses data pengguna lain, atau menjual semula Perkhidmatan tanpa persetujuan bertulis Kami."], ["9. Ketersediaan dan perubahan", "Kami berusaha memastikan Perkhidmatan berfungsi tetapi tidak menjamin ia bebas gangguan. Kami boleh mengubah ciri atau harga dengan notis yang munasabah. Perubahan harga berkuat kuasa pada tempoh bil berikutnya."], ["10. Had tanggungjawab", "Setakat yang dibenarkan undang-undang, Perkhidmatan disediakan “seadanya”. Kami tidak bertanggungjawab atas kerugian tidak langsung, kehilangan keuntungan atau denda cukai akibat data atau penggunaan anda. Jumlah tanggungjawab Kami dihadkan kepada yuran yang anda bayar dalam 12 bulan terakhir. Simpan sandaran laporan penting anda."], ["11. Penamatan", "Kami boleh menggantung atau menutup akaun yang melanggar Terma ini, dengan notis jika mungkin. Anda boleh berhenti menggunakan Perkhidmatan pada bila-bila masa dan mengeksport data sebelum akaun ditutup."], ["12. Undang-undang dan pertikaian", "Terma ini tertakluk kepada undang-undang Republik Indonesia. Pertikaian diselesaikan dahulu melalui perundingan; jika tidak berjaya, melalui mahkamah yang berwibawa di Indonesia. Pertanyaan boleh dihantar ke {K}."], ["13. Perubahan Terma", "Kami boleh mengemas kini Terma ini dan menukar tarikh berkuat kuasa. Penggunaan Perkhidmatan selepas perubahan bermakna anda menerima Terma yang baharu."]],PRIV_MS=[["1. Pengawal data", "Perkhidmatan ini dikendalikan oleh {O}, yang bertindak sebagai pengawal data peribadi bagi data akaun anda. Bagi data perakaunan yang anda masukkan, anda menentukan kandungan dan tujuannya, dan Kami memprosesnya bagi pihak anda untuk menjalankan Perkhidmatan."], ["2. Data yang Kami kumpul", "Data akaun (e-mel, nama paparan dan foto profil jika disediakan Google), data perakaunan yang anda masukkan (jurnal, invois, nama pelanggan, profil perniagaan, logo), data pasukan (e-mel ahli dan peranan), pilihan (bahasa, mata wang, tema), serta data teknikal asas seperti alamat IP dan jenis peranti yang direkodkan oleh penyedia infrastruktur."], ["3. Tujuan dan asas pemprosesan", "Untuk menyediakan Perkhidmatan, mengesahkan anda, menghantar e-mel pengesahan dan jemputan pasukan, menjaga keselamatan, memberi sokongan dan memperbaiki Perkhidmatan. Asasnya ialah persetujuan anda dan pelaksanaan perjanjian perkhidmatan. Kami tidak menjual data peribadi anda dan tidak menggunakannya untuk pengiklanan."], ["4. Pihak ketiga", "Kami menggunakan Google Firebase (pangkalan data, pengesahan dan hosting), Google (log masuk), penyedia penghantaran e-mel untuk pengesahan dan jemputan, Google Fonts untuk paparan, dan penyedia pembayaran apabila ciri berbayar tersedia. Pihak-pihak tersebut memproses data mengikut dasar dan perjanjian masing-masing."], ["5. Penyimpanan pada peranti", "Aplikasi menyimpan pilihan (bahasa, mata wang, tema) dan fail aplikasi untuk penggunaan luar talian yang terhad dalam pelayar anda. Kami tidak menggunakan penjejak iklan pihak ketiga."], ["6. Keselamatan", "Sambungan menggunakan HTTPS, akses data dihadkan bagi setiap pengguna dengan peraturan peringkat pangkalan data, dan jurnal direkodkan dalam rantaian audit. Tiada sistem yang sepenuhnya selamat. Jika berlaku kegagalan perlindungan data peribadi yang menjejaskan anda, Kami akan memaklumkan anda dan pihak berkuasa mengikut peraturan yang berkuat kuasa."], ["7. Penyimpanan dan pemadaman", "Data disimpan selagi akaun aktif atau selagi perlu untuk menjalankan Perkhidmatan dan memenuhi kewajipan undang-undang. Anda boleh meminta pemadaman akaun dan data. Salinan sandaran mungkin kekal sementara mengikut dasar penyedia infrastruktur."], ["8. Perkongsian dalam pasukan", "Ahli pasukan yang anda jemput boleh melihat data buku mengikut peranan (owner, editor, viewer). Owner boleh mengurus dan membatalkan akses ahli."], ["9. Hak anda", "Menurut Undang-Undang Pelindungan Data Peribadi Indonesia (UU No. 27 Tahun 2022) dan peraturan berkaitan, anda berhak meminta akses, pembetulan, eksport atau pemadaman data, menghadkan pemprosesan, dan menarik balik persetujuan. Hubungi {K}; Kami akan membalas dalam tempoh yang munasabah."], ["10. Kanak-kanak", "Perkhidmatan ini ditujukan untuk orang dewasa dan pengendali perniagaan, bukan untuk kanak-kanak."], ["11. Pemindahan data merentas sempadan", "Data boleh diproses di pelayan di luar Indonesia, termasuk Singapura, dan oleh penyedia perkhidmatan di negara lain, dengan perlindungan setara mengikut peraturan yang berkuat kuasa."], ["12. Perubahan dan hubungan", "Dasar ini boleh dikemas kini dan tarikh berkuat kuasa akan diubah. Pertanyaan boleh dihantar ke {K}."]];
